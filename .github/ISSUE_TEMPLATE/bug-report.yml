name: Bug report
description: Report reproducible incorrect behavior in TMOG.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve TMOG. Please submit one problem per report and remove private information from screenshots and diagnostics.
  - type: input
    id: version
    attributes:
      label: TMOG version and build
      description: Find these in About Task Manager TMOG.
      placeholder: "0.1.0 (202607310204)"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating-system version
      placeholder: "macOS 15.6 or Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Mac model and chip, or PC CPU/GPU, when relevant.
      placeholder: "MacBook Pro, Apple M4 Max"
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and its visible impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Often
        - Occasionally
        - Once
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or diagnostics
      description: Optional. Drag files here only after removing private data such as usernames, paths, process arguments, addresses, and network identifiers.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing report of this problem.
          required: true
        - label: I removed secrets and unnecessary personal information from this public report.
          required: true

